<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Coin Flip</h1>
      <div class="coin-wrap" aria-live="polite">
        <div id="coin" class="coin" aria-label="Coin">
          <div class="face heads">Heads</div>
          <div class="face tails">Tails</div>
        </div>
      </div>
      <button id="flipButton" type="button">Flip coin</button>
      <p id="result" class="result">Click the button to flip!</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
